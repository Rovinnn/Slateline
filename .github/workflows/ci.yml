name: CI

# Every push and PR. None of these jobs need credentials: the backend suite
# mocks the two functions that make network calls (Parallel search, Gemini),
# and Layer 2/3 are pure by design. The live-service check is a separate,
# manually-triggered job below, since that one does need real keys.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Typecheck + build
        run: npm run build

  smoke:
    name: Live smoke test (deployed URLs)
    # Not on every push: it calls the real deployed services (and through them
    # Parallel/Gemini/Maps quota), so it runs on demand or on a schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (requests only — the smoke test talks HTTP, not SDKs)
        run: pip install requests
      - name: Smoke test
        run: python scripts/smoke_test.py
